<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>藥學互動學習平台</title>
  <link rel="stylesheet" href="css/style.css?v=20260902-one-question" />
</head>
<body>
  <main class="app-shell">
    <section id="start-screen" class="card">
      <div class="brand">Pharmacy Learning</div>
      <h1>藥學互動學習平台</h1>
      <p class="subtitle">透過主題測驗與互動配對，強化藥品知識與實務應用</p>
      <div class="notice">
        ℹ️ 本平台內容僅供學習參考；健保給付規定與藥品資訊，請以最新官方公告及院內規範為準。
      </div>

      <label>輸入卡號
        <input id="card-number" type="text" placeholder="請輸入卡號" autocomplete="off" />
      </label>

      <label>身分
        <select id="role">
          <option value="">請選擇</option>
          <option>新進藥師</option>
          <option>PGY</option>
          <option>實習生</option>
        </select>
      </label>

      <label>學習模式
        <select id="learning-mode">
          <option value="">請選擇學習模式</option>
          <option value="quiz">健保藥品給付規定</option>
          <option value="image-name">藥品圖片 ↔ 藥品名稱</option>
          <option value="drug-dose">藥品名稱 ↔ 劑量</option>
          <option value="drug-indication">藥品名稱 ↔ 適應症</option>
        </select>
      </label>

      <label id="topic-field" class="hidden">學習主題
       <select id="topic">
<option value="">請選擇學習主題</option>
<option value="general">通則</option>
<option value="nervous">神經系統藥物</option>
<option value="cardiorenal">心臟血管及腎臟藥物</option>
<option value="metabolic">代謝及營養劑</option>
<option value="hematological">血液治療藥物</option>
<option value="hormonal">激素及影響內分泌機轉藥物</option>
<option value="respiratory_gi">呼吸道及腸胃藥物</option>
</select>
      </label>

      <button id="start-btn" class="primary">開始測驗</button>
      <p id="start-error" class="error" aria-live="polite"></p>
    </section>

    <section id="match-screen" class="card hidden">
      <div class="quiz-topbar">
        <div><div id="match-learner-info" class="muted"></div><h2 id="match-title">藥品配對挑戰</h2></div>
        <div id="match-progress" class="progress-text"></div>
      </div>
      <div class="notice demo-notice">請依藥品外觀選擇相對應的藥品名稱。</div>
      <p class="match-help">先點選左側卡片，再點選右側相對應的卡片。</p>
      <div class="match-board"><div id="match-left" class="match-column"></div><div id="match-right" class="match-column"></div></div>
      <div id="match-feedback" class="feedback info" aria-live="polite">請開始配對。</div>
      <button id="match-next-btn" class="primary hidden">下一題</button>\n      <button id="match-home-btn" class="secondary">返回首頁</button>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="quiz-topbar">
        <div>
          <div id="learner-info" class="muted"></div>
          <h2 id="topic-title">通則</h2>
        </div>
        <div id="progress-text" class="progress-text"></div>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>

      <div class="question-block">
        <div id="question-number" class="question-number"></div>
        <h3 id="question-text"></h3>
        <div id="options" class="options"></div>
      </div>

      <div id="feedback" class="feedback hidden"></div>
      <button id="next-btn" class="primary hidden">下一題</button>
    </section>

    <section id="result-screen" class="card hidden">
      <div class="brand">完成</div>
      <h2>測驗結果</h2>
      <div id="result-score" class="score"></div>
      <p id="result-summary"></p>
      <div id="submit-status" class="feedback info">目前為本機測試版，成績尚未回傳至 Google Sheet。</div>
      <div id="review-list" class="review-list"></div>
      <button id="download-btn" class="primary">下載個人成績</button>
      <button id="retry-btn" class="primary">返回首頁</button>
    </section>
  </main>

  <script src="js/questions.js"></script>
  <script src="js/game.js?v=20260902-duo-pair"></script>
</body>
</html>
